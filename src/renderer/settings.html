<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>الإعدادات</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 18px;
        background: #f6f6fb;
        color: #1f2330;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 14px;
      }
      .field {
        margin-bottom: 14px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d6d6e2;
        border-radius: 8px;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row > .field {
        flex: 1;
      }
      .hint {
        font-size: 11px;
        color: #6b7280;
        margin-top: 4px;
      }
      .switch {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .switch input {
        width: auto;
      }
      button {
        border: none;
        border-radius: 9px;
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      .primary {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: #fff;
      }
      .ghost {
        background: #ececf4;
        color: #333;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .status {
        font-size: 12px;
        color: #16a34a;
        margin-inline-start: 8px;
        align-self: center;
      }
      .card {
        background: #fff;
        border: 1px solid #ececf4;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .mem-item {
        font-size: 12px;
        padding: 6px 8px;
        border-bottom: 1px solid #f0f0f6;
      }
      .badge {
        font-size: 11px;
        background: #dcfce7;
        color: #166534;
        padding: 2px 7px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <h1>إعدادات Mira</h1>

    <div class="card">
      <div class="field">
        <label>مزوّد الذكاء الاصطناعي</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic (Claude)</option>
          <option value="gemini">Google Gemini</option>
        </select>
      </div>

      <div class="field">
        <label>مفتاح الـ API <span id="envBadge" class="badge" style="display:none">من متغير البيئة</span></label>
        <input id="apiKey" type="password" placeholder="••••••••••••••••" />
        <div class="hint" id="keyHint">
          يُحفظ محليًا فقط. إذا كان متغيّر البيئة LLM_API_KEY مضبوطًا فسيُستخدم تلقائيًا.
        </div>
      </div>

      <div class="field">
        <label>الموديل (اختياري — اتركه فارغًا للافتراضي)</label>
        <input id="model" type="text" placeholder="مثال: gpt-4o-mini" />
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="field">
          <label>المجال</label>
          <select id="profession"></select>
        </div>
        <div class="field">
          <label>مستوى الخبرة</label>
          <select id="experienceLevel">
            <option value="beginner">مبتدئ</option>
            <option value="intermediate">متوسط</option>
            <option value="advanced">متقدّم</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>اللغة</label>
        <select id="language">
          <option value="ar">العربية</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="field switch">
        <input id="proactive" type="checkbox" />
        <label for="proactive" style="margin:0">نصائح تلقائية دورية</label>
      </div>
      <div class="field">
        <label>الفاصل الزمني (ثوانٍ)</label>
        <input id="intervalSeconds" type="number" min="15" step="5" />
      </div>
      <div class="field switch">
        <input id="webSearchEnabled" type="checkbox" />
        <label for="webSearchEnabled" style="margin:0">تفعيل البحث في الويب للتحقق من الحقائق</label>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="saveBtn">حفظ</button>
      <span class="status" id="status"></span>
    </div>

    <div class="card" style="margin-top:18px">
      <label>ذاكرة المساعد (ما تعلّمه عنك)</label>
      <div id="memList" style="max-height:160px;overflow:auto;margin:8px 0"></div>
      <button class="ghost" id="clearMem">مسح الذاكرة</button>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
